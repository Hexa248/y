{{define "content"}}
<section class="hero">
  <h1>Booking Hotel Indonesia ala Travel Super App</h1>
  <p>20 kota ikonik, 10 hotel per kota, 10 kamar per hotel.</p>

  <form class="search-panel" onsubmit="return false;">
    <div class="search-item">
      <label for="searchText">Kota atau Hotel</label>
      <input id="searchText" type="text" placeholder="Contoh: Bandung / Signature Hotel" autocomplete="off">
    </div>
    <div class="search-item">
      <label for="checkIn">Check-in</label>
      <input id="checkIn" type="date">
    </div>
    <div class="search-item">
      <label for="checkOut">Check-out</label>
      <input id="checkOut" type="date">
    </div>
    <div class="search-item guest-room-picker-wrap">
      <label for="guestRoomPicker">Tamu dan Kamar</label>
      <button id="guestRoomPicker" class="guest-room-picker" type="button" aria-expanded="false">
        <span class="guest-room-icon">👥</span>
        <span id="guestRoomSummary">2 Dewasa, 0 Anak, 1 Kamar</span>
        <span>⌄</span>
      </button>
      <div id="guestRoomPopover" class="guest-room-popover hidden">
        <div class="counter"><span>Dewasa</span><div><button type="button" data-dec="adult">-</button><b id="adultVal">2</b><button type="button" data-inc="adult">+</button></div></div>
        <div class="counter"><span>Anak</span><div><button type="button" data-dec="child">-</button><b id="childVal">0</b><button type="button" data-inc="child">+</button></div></div>
        <div class="counter"><span>Kamar</span><div><button type="button" data-dec="room">-</button><b id="roomVal">1</b><button type="button" data-inc="room">+</button></div></div>
      </div>
    </div>
  </form>
  <p id="searchInfo" class="search-info">Menampilkan semua kota.</p>
</section>

<section class="city-grid" id="cityGrid">
{{range .Cities}}
<article class="card city-card" data-city="{{.Name}}" data-hotels='{{index $.CityHotelNames .ID}}' onclick="location.href='/hotels?city={{.ID}}'">
<img src="{{.ImageURL}}" alt="{{.Name}}">
<div class="pad"><h3>{{.Name}}</h3><p>Klik untuk lihat 10 hotel terbaik.</p></div>
</article>
{{end}}
</section>
{{end}}
